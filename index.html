<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NASA APOD - Space Pulse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="app">
      <div class="pulse-bar"></div>

      <header class="site-header">
        <h1>NASA Astronomy Picture of the Day</h1>
        <p>Automatically updated daily using NASA's APOD API.</p>
      </header>
       
      <main class="apod-layout">
        <section class="apod-media">
          <div id="apod-media-container" class="media-container">
    
          </div>
        </section>       

        <section class="apod-info">
          <h2 id="apod-title">Loading...</h2>
          <p id="apod-date" class="apod-date"></p>
          <p id="apod-explanation" class="apod-explanation"></p>

          <div class="apod-controls">
            <label>
              Pick a date:
              <input type="date" id="apod-date-input" />
            </label>
            <button id="apod-refresh-btn">Fetch APOD</button>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
